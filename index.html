<script>
const CATS=["Social Media","Marketing Materials","Branding","Print Materials","Events","Presentations","Documents","Internal Materials","Merchandise","Video","Templates","Others"];
const VIEWS={"Social Media":"Intuit Postings 2026","Marketing Materials":"Marketing Materials","Branding":"Branding Assets","Print Materials":"Print Materials","Events":"Event Materials","Presentations":"Presentations","Documents":"Documents","Video":"Video Projects","Templates":"Templates","Internal Materials":"Internal Company Materials"};

const fixDept=d=>({marketing:"Brand Team",hr:"People",management:"Interns"})[String(d||"").toLowerCase()]||d;
const DEPTS=["Brand Team","Operations","People","Interns","Others"],STATS=["Active","In Progress","For Revision","Archived","Discontinued"];
const S={v:"dash",q:"",fc:"",fd:"",fs:"",sort:"added"};

/* ---------- Supabase shared storage ---------- */
const SUPABASE_URL = "https://kmvuquujqctzvjlbfelx.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_bkQpkSDRah97mWjbaE2tug_IGoRojFR";
if(!window.supabase){throw new Error("Supabase library did not load. Check your internet connection.");}
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
let refreshTimer = null;
function lsGet(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function showApp(){$("app").style.display="flex"}
async function refreshFromCloud(){
  const [linkRes,catRes]=await Promise.all([
    supabaseClient.from("links").select("*").order("added",{ascending:false}),
    supabaseClient.from("categories").select("name").order("name")
  ]);
  if(linkRes.error)throw linkRes.error;if(catRes.error)throw catRes.error;
  rows=(linkRes.data||[]).map(r=>({...r,dept:fixDept(r.dept)}));
  custom=(catRes.data||[]).map(r=>r.name).filter(n=>!CATS.includes(n));render();
}
async function initStore(){
  try{
    await refreshFromCloud();
    showApp();mode="shared";
    if(refreshTimer)clearInterval(refreshTimer);
    refreshTimer=setInterval(()=>refreshFromCloud().catch(e=>console.error("Cloud refresh failed:",e)),12000);
    render();
  }catch(e){
    $("view").innerHTML=`<div class="card"><h1>Repository temporarily unavailable</h1><p>We couldn't connect to the shared database. Please check the public read/write policies in Supabase.</p><p style="color:var(--mu)">${esc(e.message||"Database connection failed.")}</p></div>`;
    console.error("Public database connection failed:",e);
  }
}
async function saveRow(r){
  const {error}=await supabaseClient.from("links").upsert(r);
  if(error){toast("Could not save: "+error.message);return}
  await refreshFromCloud();
}
async function delRow(id){
  const {error}=await supabaseClient.from("links").delete().eq("id",id);
  if(error){toast("Could not delete: "+error.message);return}
  await refreshFromCloud();
}
async function saveCats(){
  if(custom.length){
    const {error}=await supabaseClient.from("categories").upsert(custom.map(name=>({name})));
    if(error){toast("Could not save category: "+error.message);return}
  }
  await refreshFromCloud();
}
function nextId(){const n=rows.reduce((m,r)=>Math.max(m,parseInt(String(r.id).replace(/\D/g,""))||0),0)+1;return "CL-"+String(n).padStart(4,"0")}

/* ---------- helpers ---------- */
function normUrl(u){try{const x=new URL(u.trim());const m=x.pathname.match(/\/design\/([\w-]+)/);return m?"design:"+m[1]:(x.hostname.replace(/^www\./,"")+x.pathname.replace(/\/$/,"")).toLowerCase()}catch(e){return null}}
function validUrl(u){try{const x=new URL(u.trim());return /^https?:$/.test(x.protocol)&&/(^|\.)canva\.(com|link)$/i.test(x.hostname)}catch(e){return false}}
const findDup=(u,ex)=>{const k=normUrl(u);return rows.find(r=>r.id!==ex&&normUrl(r.url)===k)};
function csvCell(v){v=String(v??"");return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
const COLS=[["id","Reference ID"],["name","Project / Design Name"],["url","Canva Link"],["category","Category"],["sub","Subcategory"],["dept","Department"],["campaign","Project / Campaign"],["created","Date Created"],["added","Date Added"],["by","Created By"],["updated","Last Updated"],["status","Status"],["notes","Description / Notes"]];
function parseCSV(t){const out=[];let r=[],c="",q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==","){r.push(c);c=""}else if(ch=="\n"||ch=="\r"){if(ch=="\r"&&t[i+1]=="\n")i++;r.push(c);c="";if(r.some(x=>x.trim()))out.push(r);r=[]}else c+=ch}
  r.push(c);if(r.some(x=>x.trim()))out.push(r);return out}

/* ---------- views ---------- */
function viewList(){
  const l=[["dash","Dashboard"],["all","All Canva Links"]];
  const nav=[`<h6>Overview</h6>`,...l.map(([k,n])=>b(k,n,k==="all"?rows.length:""))];
  nav.push("<h6>Categories</h6>");
  allCats().forEach(c=>nav.push(b("cat:"+c,VIEWS[c]||c,rows.filter(r=>r.category===c).length)));
  nav.push("<h6>Status</h6>",b("arch","Archived Designs",rows.filter(r=>r.status==="Archived").length));
  nav.push("<h6>Manage</h6>",`<button onclick="openImport()">Bulk Import</button>`,`<button onclick="openCat()">+ Custom Category</button>`,`<button onclick="exportData('csv')">Export CSV</button>`,`<button onclick="exportData('xls')">Export Excel</button>`);
  $("nav").innerHTML=nav.join("");
  function b(k,n,c){return `<button class="${S.v===k?"on":""}" onclick="go('${esc(k).replace(/'/g,"\\'")}')">${esc(n)}<b>${c}</b></button>`}
}
function go(v){S.v=v;S.fc="";side.classList.remove("on");render();scrollTo(0,0)}
function match(r){
  const q=S.q.trim().toLowerCase();
  if(q&&![r.id,r.name,r.url,r.category,r.sub,r.dept,r.campaign,r.by,r.status,r.notes].join(" ").toLowerCase().includes(q))return false;
  if(S.v==="arch"&&r.status!=="Archived")return false;
  if(S.v.startsWith("cat:")&&r.category!==S.v.slice(4))return false;
  if(S.fc&&r.category!==S.fc)return false;if(S.fd&&r.dept!==S.fd)return false;if(S.fs&&r.status!==S.fs)return false;return true}
function render(){
  viewList();
  if(S.v==="dash"&&!S.q){dash();return}
  const title=S.v==="all"||S.v==="dash"?"All Canva Links":S.v==="arch"?"Archived Designs":(VIEWS[S.v.slice(4)]||S.v.slice(4));
  let list=rows.filter(match);
  const so={added:(a,b)=>(b.added||"").localeCompare(a.added||"")||b.id.localeCompare(a.id),oldest:(a,b)=>(a.added||"").localeCompare(b.added||"")||a.id.localeCompare(b.id),az:(a,b)=>(a.name||"").localeCompare(b.name||""),upd:(a,b)=>(b.updated||"").localeCompare(a.updated||"")}[S.sort];
  list.sort(so);
  const o=(arr,v)=>arr.map(x=>`<option ${x===v?"selected":""}>${esc(x)}</option>`).join("");
  const showCat=S.v==="all"||S.v==="dash";
  $("view").innerHTML=`<h1>${esc(title)} <small style="color:var(--mu);font-weight:500;font-size:14px">${list.length} result${list.length===1?"":"s"}</small></h1>
  <div class="filters">${showCat?`<select onchange="S.fc=this.value;render()"><option value="">All categories</option>${o(allCats(),S.fc)}</select>`:""}
  <select onchange="S.fd=this.value;render()"><option value="">All departments</option>${o(DEPTS,S.fd)}</select>
  <select onchange="S.fs=this.value;render()"><option value="">All statuses</option>${o(STATS,S.fs)}</select>
  <select onchange="S.sort=this.value;render()"><option value="added" ${S.sort=="added"?"selected":""}>Newest added</option><option value="oldest" ${S.sort=="oldest"?"selected":""}>Oldest added</option><option value="az" ${S.sort=="az"?"selected":""}>Alphabetical (A to Z)</option><option value="upd" ${S.sort=="upd"?"selected":""}>Recently updated</option></select>
  <button class="btn p" onclick="openForm()">+ Add New Link</button></div>
  <div class="tw">${list.length?`<table><thead><tr><th>ID</th><th>Design</th><th>Link</th><th>Category</th><th>Dept</th><th>Campaign</th><th>Created by</th><th>Dates</th><th>Status</th><th></th></tr></thead><tbody>${list.map(row).join("")}</tbody></table>`:`<div class="empty">${rows.length?"No links match your search or filters.":"No links yet. Add your first Canva link or bulk import a list."}</div>`}</div>
  <p style="color:var(--mu);font-size:12px">${mode==="shared"?"Live shared database: anyone with this link can edit records.":"Connect to the public shared database to collaborate."}</p>`}
function row(r){const u=esc(r.url);return `<tr><td data-l="ID">${esc(r.id)}</td>
<td data-l="Design"><b>${esc(r.name)}</b>${r.notes?`<small>${esc(r.notes)}</small>`:""}</td>
<td><a href="${u}" target="_blank" rel="noopener noreferrer">Open in Canva ↗</a></td>
<td data-l="Category">${esc(r.category)}<small>${esc(r.sub)}</small></td><td data-l="Dept">${esc(r.dept)}</td><td data-l="Campaign">${esc(r.campaign)||"-"}</td><td data-l="By">${esc(r.by)||"-"}</td>
<td data-l="Dates"><small>Created ${esc(r.created)||"-"}</small><small>Added ${esc(r.added)}</small><small>Updated ${esc(r.updated)}</small></td>
<td><span class="pill ${sk(r.status||"")}">${esc(r.status)}</span></td>
<td><div class="acts"><button class="btn s" onclick="openForm('${r.id}')">Edit</button><button class="btn s" onclick="openForm('${r.id}',1)">Duplicate</button>${r.status!=="Archived"?`<button class="btn s" onclick="archive('${r.id}')">Archive</button>`:`<button class="btn s" onclick="restore('${r.id}')">Restore</button>`}<button class="btn s d" onclick="confirmDel('${r.id}')">Delete</button></div></td></tr>`}
function bars(key,arr){const m={};arr.forEach(r=>m[r[key]||"Unspecified"]=(m[r[key]||"Unspecified"]||0)+1);const e=Object.entries(m).sort((a,b)=>b[1]-a[1]);const mx=e[0]?e[0][1]:1;
  return e.length?e.map(([k,v])=>`<div class="bar"><span>${esc(k)}</span><div><i style="width:${v/mx*100}%"></i></div><b>${v}</b></div>`).join(""):`<div class="empty" style="padding:12px">No data yet</div>`}
function dash(){
  const projects=new Set(rows.map(r=>(r.campaign||"").trim().toLowerCase()).filter(Boolean)).size;
  const rec=[...rows].sort((a,b)=>(b.added||"").localeCompare(a.added||"")||b.id.localeCompare(a.id)).slice(0,6);
  const upd=[...rows].sort((a,b)=>(b.updated||"").localeCompare(a.updated||"")||b.id.localeCompare(a.id)).slice(0,6);
  const li=(r,k,l)=>`<div class="li"><div><a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.name)}</a><small> ${esc(r.category)}</small></div><small>${l} ${esc(r[k])}</small></div>`;
  $("view").innerHTML=`<h1>Dashboard</h1>
  <div class="stats"><div class="card"><h3>Total Canva Links</h3><div class="big">${rows.length}</div></div><div class="card"><h3>Total Projects</h3><div class="big">${projects}</div></div><div class="card"><h3>Active</h3><div class="big">${rows.filter(r=>r.status==="Active").length}</div></div><div class="card"><h3>Archived</h3><div class="big">${rows.filter(r=>r.status==="Archived").length}</div></div></div>
  <div class="grid2"><div class="card"><h3>Links by Category</h3>${bars("category",rows)}</div><div class="card"><h3>Links by Department</h3>${bars("dept",rows)}</div></div>
  <div class="grid2"><div class="card"><h3>Recently Added Designs</h3>${rec.length?rec.map(r=>li(r,"added","Added")).join(""):"<small>Nothing yet</small>"}</div><div class="card"><h3>Recently Updated Entries</h3>${upd.length?upd.map(r=>li(r,"updated","Updated")).join(""):"<small>Nothing yet</small>"}</div></div>
  <p style="color:var(--mu);font-size:12px">${mode==="shared"?"Live shared database: anyone with this link can edit records.":"Connect to the public shared database to collaborate."}</p>`}

/* ---------- modals ---------- */
function modal(h){$("md").innerHTML=h;$("ov").classList.add("on")}
function closeM(){$("ov").classList.remove("on")}
$("ov").addEventListener("mousedown",e=>{if(e.target.id==="ov")closeM()});
function opts(arr,v){return arr.map(x=>`<option ${x===v?"selected":""}>${esc(x)}</option>`).join("")}
function openForm(id,dupMode){
  const r=id?rows.find(x=>x.id===id):null;const e=r?{...r}:{category:S.v.startsWith("cat:")?S.v.slice(4):"Social Media",dept:"Brand Team",status:"Active",by:lsGet("clh_by","")};
  if(dupMode){e.name=(e.name||"")+" (Copy)";e.id=null}
  modal(`<h2>${r&&!dupMode?"Edit Canva Link":dupMode?"Duplicate Entry":"Add New Canva Link"}</h2>
  <div class="f"><label class="w"><span>Project / Design Name *</span><input id="fn" value="${esc(e.name)}"></label>
  <label class="w"><span>Canva URL *</span><input id="fu" type="url" placeholder="https://www.canva.com/design/..." value="${esc(e.url)}"></label>
  <label><span>Category</span><select id="fc" onchange="subs()">${opts(allCats(),e.category)}</select></label>
  <label><span>Subcategory</span><input id="fsub" list="sl" value="${esc(e.sub)}"><datalist id="sl"></datalist></label>
  <label><span>Department</span><select id="fd">${opts(DEPTS,e.dept)}</select></label>
  <label><span>Status</span><select id="fst">${opts(STATS,e.status)}</select></label>
  <label><span>Project / Campaign</span><input id="fcp" value="${esc(e.campaign)}"></label>
  <label><span>Created By</span><input id="fby" value="${esc(e.by)}"></label>
  <label><span>Date Created</span><input id="fdc" type="date" value="${esc(e.created)}"></label>
  <label class="w"><span>Description / Notes</span><textarea id="fno" rows="3">${esc(e.notes)}</textarea></label></div>
  <div class="err" id="fe">${dupMode?"Duplicate mode: the URL can be kept for a variant, or replaced.":""}</div>
  <div class="ft"><button class="btn" onclick="closeM()">Cancel</button><button class="btn p" onclick="submitForm(${id&&!dupMode?`'${id}'`:"null"},${dupMode?1:0})">Save</button></div>`);
  subs();$("fn").focus()}
function subs(){$("sl").innerHTML=(SUBS[$("fc").value]||[]).map(s=>`<option value="${esc(s)}">`).join("")}
async function submitForm(id,dupMode){
  const v=k=>$(k).value.trim(),err=m=>$("fe").textContent=m;
  const name=v("fn"),url=v("fu");
  if(!name)return err("Please enter a project or design name.");
  if(!validUrl(url))return err("Please paste a valid Canva URL (canva.com or canva.link).");
  const d=findDup(url,id);if(d&&!dupMode)return err(`This link is already saved as ${d.id}: ${d.name}`);
  const old=id?rows.find(x=>x.id===id):null;
  const r={id:id||nextId(),name,url,category:v("fc"),sub:v("fsub"),dept:v("fd"),campaign:v("fcp"),created:v("fdc"),added:old?old.added:today(),by:v("fby"),updated:today(),status:v("fst"),notes:v("fno")};
  lsSet("clh_by",r.by);closeM();await saveRow(r);toast(id?"Entry updated":"Link added")}
async function archive(id){const r=rows.find(x=>x.id===id);await saveRow({...r,status:"Archived",updated:today()});toast("Archived")}
async function restore(id){const r=rows.find(x=>x.id===id);await saveRow({...r,status:"Active",updated:today()});toast("Restored")}
function confirmDel(id){const r=rows.find(x=>x.id===id);modal(`<h2>Delete this entry?</h2><p>"${esc(r.name)}" (${esc(r.id)}) will be permanently removed from the library. This cannot be undone. Consider archiving instead.</p><div class="ft"><button class="btn" onclick="closeM()">Cancel</button><button class="btn" onclick="archive('${id}');closeM()">Archive instead</button><button class="btn p" style="background:var(--er);border-color:var(--er)" onclick="closeM();delRow('${id}').then(()=>toast('Deleted'))">Delete</button></div>`)}
function openCat(){modal(`<h2>New Custom Category</h2><label style="font-size:12px;color:var(--mu);font-weight:600">Category name<input id="cn" placeholder="e.g. Partnerships"></label><div class="err" id="fe"></div><div class="ft"><button class="btn" onclick="closeM()">Cancel</button><button class="btn p" onclick="addCat()">Create</button></div>`);$("cn").focus()}
async function addCat(){const n=$("cn").value.trim();if(!n)return $("fe").textContent="Enter a name.";if(allCats().some(c=>c.toLowerCase()===n.toLowerCase()))return $("fe").textContent="That category already exists.";custom.push(n);closeM();await saveCats();render();toast("Category created")}
function openImport(){modal(`<h2>Bulk Import</h2><p style="margin:0 0 8px;color:var(--mu)">Paste one Canva URL per line, or use <code>Name | URL | Category | Department</code>. You can also upload a CSV exported from this tool. Duplicates and invalid links are skipped.</p>
  <textarea id="bi" rows="8" placeholder="Spring Menu | https://www.canva.com/design/... | Print Materials | Operations"></textarea>
  <div style="margin-top:8px"><input type="file" id="bf" accept=".csv,.txt"></div><div class="err" id="fe"></div>
  <div class="ft"><button class="btn" onclick="closeM()">Cancel</button><button class="btn p" onclick="runImport()">Import</button></div>`);
  $("bf").onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>$("bi").value=rd.result;rd.readAsText(f)}}
async function runImport(){
  const t=$("bi").value.trim();if(!t)return $("fe").textContent="Nothing to import.";
  let recs=[];const first=t.split(/\r?\n/)[0];
  if(/Reference ID/i.test(first)||/Canva Link/i.test(first)){const p=parseCSV(t),h=p[0];recs=p.slice(1).map(c=>{const g=l=>c[h.indexOf(l)]||"";return{name:g("Project / Design Name"),url:g("Canva Link"),category:g("Category"),sub:g("Subcategory"),dept:g("Department"),campaign:g("Project / Campaign"),created:g("Date Created"),by:g("Created By"),status:g("Status"),notes:g("Description / Notes")}})}
  else recs=t.split(/\r?\n/).filter(l=>l.trim()).map(l=>{const p=l.split("|").map(s=>s.trim());if(p.length===1)return{url:p[0]};return{name:p[0],url:p[1],category:p[2],dept:p[3]}});
  let ok=0,dup=0,bad=0;const seen=new Set(rows.map(r=>normUrl(r.url)));
  let n=parseInt(nextId().slice(3));const batch=[];
  for(const x of recs){if(!validUrl(x.url||"")){bad++;continue}const k=normUrl(x.url);if(seen.has(k)){dup++;continue}seen.add(k);
    const cat=allCats().find(c=>c.toLowerCase()===(x.category||"").toLowerCase())||"Others";
    batch.push({id:"CL-"+String(n++).padStart(4,"0"),name:x.name||"Untitled design",url:x.url.trim(),category:cat,sub:x.sub||"",dept:DEPTS.find(d=>d.toLowerCase()===fixDept(x.dept||"").toLowerCase())||"Others",campaign:x.campaign||"",created:x.created||"",added:today(),by:x.by||"",updated:today(),status:STATS.find(s=>s.toLowerCase()===(x.status||"").toLowerCase())||"Active",notes:x.notes||""});ok++}
  closeM();for(const r of batch)await saveRow(r);toast(`Imported ${ok}. Skipped ${dup} duplicates, ${bad} invalid.`)}
async function exportData(t){
  const list=rows.filter(match).length&&(S.v!=="dash"||S.q)?rows.filter(match):rows;
  if(!list.length)return toast("Nothing to export yet");
  let data,fn="canva-links-"+today();
  if(t==="csv"){data="\ufeff"+[COLS.map(c=>csvCell(c[1])).join(","),...list.map(r=>COLS.map(c=>csvCell(r[c[0]])).join(","))].join("\r\n");fn+=".csv"}
  else{data=`<html><head><meta charset="utf-8"></head><body><table border="1"><tr>${COLS.map(c=>`<th>${esc(c[1])}</th>`).join("")}</tr>${list.map(r=>`<tr>${COLS.map(c=>`<td>${esc(r[c[0]])}</td>`).join("")}</tr>`).join("")}</table></body></html>`;fn+=".xls"}
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"text/plain"}));a.download=fn;a.click()}catch(e){toast("Export is not available here")}}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeM()});
initStore();
</script></body></html>
